# =======================================================
# Campus custom ModSecurity rules - SQL injection
# Rule IDs 10001-10006 (the 1-99999 range is for local rules)
#
# Why two phases?
#   The OWASP CRS blocks on its anomaly score at the end of phase 2, and this
#   file loads after the CRS. Query-string and cookie checks therefore run in
#   phase 1, so these custom rules are the ones that reject the request.
#   Request-body checks can only run in phase 2, where they back up the CRS.
#   They inspect ARGS, not ARGS_POST: ModSecurity v3 does not put JSON body
#   fields (as used by the Juice Shop login) into ARGS_POST.
# =======================================================

# --- 1. Quote-based tautologies:  ' OR '1'='1   'OR'1'='1   ' or true -------
SecRule ARGS_GET|ARGS_GET_NAMES|REQUEST_COOKIES "@rx (?i)[\x27\x22\x60][\s)]*(?:(?:or|and)\b|\|\||&&)[\s(]*(?:(?:true|not\s+false)\b|[\x27\x22\x60]?\w*[\x27\x22\x60]?\s*(?:=|<>|!=|<|>|\blike\b))" \
    "id:10001,\
    phase:1,\
    deny,\
    status:403,\
    log,\
    t:none,t:urlDecodeUni,t:replaceComments,t:compressWhitespace,\
    msg:'CAMPUS-WAF: SQL injection tautology in query string or cookie',\
    logdata:'Matched %{MATCHED_VAR_NAME}',\
    tag:'attack-sqli',\
    severity:'CRITICAL'"

SecRule ARGS|ARGS_NAMES "@rx (?i)[\x27\x22\x60][\s)]*(?:(?:or|and)\b|\|\||&&)[\s(]*(?:(?:true|not\s+false)\b|[\x27\x22\x60]?\w*[\x27\x22\x60]?\s*(?:=|<>|!=|<|>|\blike\b))" \
    "id:10002,\
    phase:2,\
    deny,\
    status:403,\
    log,\
    t:none,t:urlDecodeUni,t:replaceComments,t:compressWhitespace,\
    msg:'CAMPUS-WAF: SQL injection tautology in request body',\
    logdata:'Matched %{MATCHED_VAR_NAME}',\
    tag:'attack-sqli',\
    severity:'CRITICAL'"

# --- 2. UNION SELECT and numeric tautologies:  1 OR 1=1 ---------------------
SecRule ARGS_GET|ARGS_GET_NAMES|REQUEST_COOKIES "@rx (?i)(?:\bunion\b[\s(]+(?:(?:all|distinct)[\s(]+)?select\b|\b(?:or|and)\b[\s(]+\d+\s*=\s*\d+)" \
    "id:10003,\
    phase:1,\
    deny,\
    status:403,\
    log,\
    t:none,t:urlDecodeUni,t:replaceComments,t:compressWhitespace,\
    msg:'CAMPUS-WAF: SQL injection UNION/numeric tautology in query string or cookie',\
    logdata:'Matched %{MATCHED_VAR_NAME}',\
    tag:'attack-sqli',\
    severity:'CRITICAL'"

SecRule ARGS|ARGS_NAMES "@rx (?i)(?:\bunion\b[\s(]+(?:(?:all|distinct)[\s(]+)?select\b|\b(?:or|and)\b[\s(]+\d+\s*=\s*\d+)" \
    "id:10004,\
    phase:2,\
    deny,\
    status:403,\
    log,\
    t:none,t:urlDecodeUni,t:replaceComments,t:compressWhitespace,\
    msg:'CAMPUS-WAF: SQL injection UNION/numeric tautology in request body',\
    logdata:'Matched %{MATCHED_VAR_NAME}',\
    tag:'attack-sqli',\
    severity:'CRITICAL'"

# --- 3. Quote followed by comment or stacked query:  admin'--   '; DROP ... --
SecRule ARGS_GET|ARGS_GET_NAMES|REQUEST_COOKIES "@rx (?i)[\x27\x22\x60][\s)]*(?:--|;\s*(?:select|insert|update|delete|drop|alter|create|truncate|shutdown)\b)" \
    "id:10005,\
    phase:1,\
    deny,\
    status:403,\
    log,\
    t:none,t:urlDecodeUni,t:replaceComments,t:compressWhitespace,\
    msg:'CAMPUS-WAF: SQL injection terminator/stacked query in query string or cookie',\
    logdata:'Matched %{MATCHED_VAR_NAME}',\
    tag:'attack-sqli',\
    severity:'CRITICAL'"

SecRule ARGS|ARGS_NAMES "@rx (?i)[\x27\x22\x60][\s)]*(?:--|;\s*(?:select|insert|update|delete|drop|alter|create|truncate|shutdown)\b)" \
    "id:10006,\
    phase:2,\
    deny,\
    status:403,\
    log,\
    t:none,t:urlDecodeUni,t:replaceComments,t:compressWhitespace,\
    msg:'CAMPUS-WAF: SQL injection terminator/stacked query in request body',\
    logdata:'Matched %{MATCHED_VAR_NAME}',\
    tag:'attack-sqli',\
    severity:'CRITICAL'"
